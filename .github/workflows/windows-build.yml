name: Build native OBS checklist for Windows
on:
  push:
    branches: [main, obs-checklist-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out plugin source
        uses: actions/checkout@v4
      - name: Build with official OBS dependencies
        shell: pwsh
        run: ./ci/Build-Release.ps1
      - name: Upload installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: Todo-Plugin-Windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 30
